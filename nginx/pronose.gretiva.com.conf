# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name pronose.gretiva.com;
    return 301 https://$host$request_uri;
}

# HTTPS main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pronose.gretiva.com;

    ssl_certificate     /etc/letsencrypt/live/pronose.gretiva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pronose.gretiva.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /home/dreamy-8/idig-its/pronose/client/dist;
    index index.html;

    # Match multer's 10 MB upload cap
    client_max_body_size 10m;

    # Express REST API
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # User-uploaded files served directly by nginx (no Node.js hop)
    location /uploads/ {
        alias     /home/dreamy-8/idig-its/pronose/server/uploads/;
        expires   30d;
        add_header Cache-Control "public, immutable";
        autoindex off;
    }

    # React SPA fallback — unknown paths → index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
